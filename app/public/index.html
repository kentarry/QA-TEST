<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>外包知識庫</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Noto+Sans+TC:wght@400;500;700&amp;family=Noto+Serif+TC:wght@600;700&amp;display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F3F6F5; --surface:#FFFFFF; --surface2:#ECF2F1;
  --ink:#182726; --muted:#5B6E6C; --line:#D8E2E0; --line-soft:#E5ECEA;
  --accent:#0E7C86; --accent-ink:#0A5A62; --on-accent:#FFFFFF; --accent-soft:#E0EFF0;
  --open:#96630F; --open-bg:#F6ECD7; --ok:#2F7D46; --ok-bg:#E1F0E5;
  --danger:#B3403A; --danger-bg:#F8E9E8; --mark:#FFE9A8;
  --shadow:0 10px 30px rgba(24,39,38,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1719; --surface:#151F21; --surface2:#1B282B;
    --ink:#E4EDEB; --muted:#8FA5A2; --line:#263A3D; --line-soft:#1F3134;
    --accent:#4FC2CC; --accent-ink:#7AD4DC; --on-accent:#062A2E; --accent-soft:#123236;
    --open:#E0A94F; --open-bg:#33290F; --ok:#66C284; --ok-bg:#12301C;
    --danger:#E0837D; --danger-bg:#3A1F1D; --mark:#5A4A12;
    --shadow:0 10px 30px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1719; --surface:#151F21; --surface2:#1B282B;
  --ink:#E4EDEB; --muted:#8FA5A2; --line:#263A3D; --line-soft:#1F3134;
  --accent:#4FC2CC; --accent-ink:#7AD4DC; --on-accent:#062A2E; --accent-soft:#123236;
  --open:#E0A94F; --open-bg:#33290F; --ok:#66C284; --ok-bg:#12301C;
  --danger:#E0837D; --danger-bg:#3A1F1D; --mark:#5A4A12;
  --shadow:0 10px 30px rgba(0,0,0,.55);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.65}
h1,h2,h3,p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent-ink)}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.mono{font-family:"IBM Plex Mono",Consolas,monospace}
.wrap{max-width:900px;margin:0 auto;padding:0 20px 72px}

.masthead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:26px 0 16px;border-bottom:1px solid var(--line)}
.wordmark{font-family:"Noto Serif TC",serif;font-weight:700;font-size:26px;letter-spacing:.04em;line-height:1.2}
.wordmark a{color:inherit;text-decoration:none}
.tagline{color:var(--muted);font-size:13px;margin-top:5px}
.mast-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.mast-stats{font-family:"IBM Plex Mono",Consolas,monospace;font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.mast-stats b{color:var(--ink);font-weight:500}
.mast-stats .warn{color:var(--open);font-weight:500}
.userbar{display:flex;align-items:center;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.userbar .who{font-size:12.5px;color:var(--muted);margin-right:4px}

.home-sect{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:26px 0 2px}
.projgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:12px}
.projcard{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:18px 20px 16px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:7px;transition:border-color .12s}
.projcard:hover{border-color:var(--accent)}
.projcard .pname{font-family:"Noto Serif TC",serif;font-size:19px;font-weight:700;line-height:1.35}
.projcard .pstats{font-size:12px;color:var(--muted);font-family:"IBM Plex Mono",Consolas,monospace}
.pwarn{color:var(--open);font-weight:500}
.proj-head{padding:20px 0 4px}
.proj-title{font-family:"Noto Serif TC",serif;font-size:24px;font-weight:700;line-height:1.3}
.proj-sub{color:var(--muted);font-size:12.5px;margin-top:6px;font-family:"IBM Plex Mono",Consolas,monospace}

.toolbar{display:flex;gap:10px;margin:20px 0 12px;flex-wrap:wrap}
.search-box{flex:1;min-width:240px;position:relative}
.search-input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);background:var(--surface);border-radius:4px;font-size:15px}
.search-input::placeholder{color:var(--muted);opacity:.85}
.search-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:14.5px;font-weight:500;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-ghost{background:transparent;color:var(--muted);font-weight:400;font-size:13px;padding:7px 12px}
.btn-ghost:hover{color:var(--accent-ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 6px}
.chiprow .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:4px 13px;border-radius:999px;font-size:13px;cursor:pointer;line-height:1.5}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.chip .cnt{font-family:"IBM Plex Mono",Consolas,monospace;font-size:11.5px;margin-left:4px;opacity:.8}

.result-note{color:var(--muted);font-size:13px;margin:14px 2px 4px}
.qlist{margin-top:6px}
.qrow{display:grid;grid-template-columns:4px 62px minmax(0,1fr) auto;gap:0 16px;align-items:center;padding:15px 10px 15px 0;border-bottom:1px solid var(--line-soft);text-decoration:none;color:inherit;transition:background .12s}
.qrow:hover{background:var(--surface)}
.stripe{width:4px;height:100%;min-height:40px;border-radius:2px}
.stripe.open{background:var(--open)}
.stripe.answered{background:var(--ok)}
.qnum{font-family:"IBM Plex Mono",Consolas,monospace;font-size:12.5px;color:var(--muted)}
.qmain{min-width:0}
.qtitle{font-weight:500;font-size:15.5px;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.qsnippet{color:var(--muted);font-size:13px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.qside{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.qside .when{font-family:"IBM Plex Mono",Consolas,monospace;font-size:11.5px;color:var(--muted)}
.tagline-cat{font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;font-weight:500;line-height:1.6;white-space:nowrap}
.pill.open{background:var(--open-bg);color:var(--open)}
.pill.answered{background:var(--ok-bg);color:var(--ok)}
.pill.cat{background:var(--surface2);color:var(--muted);font-weight:400}
.pill.proj{background:var(--accent-soft);color:var(--accent-ink)}
.empty{padding:56px 20px;text-align:center;color:var(--muted)}
.empty .big{font-family:"Noto Serif TC",serif;font-size:18px;color:var(--ink);margin-bottom:8px}

.backrow{margin:18px 0 4px}
.dhead{padding:16px 0 18px;border-bottom:1px solid var(--line)}
.dmeta-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dtitle{font-family:"Noto Serif TC",serif;font-size:24px;font-weight:700;line-height:1.4;margin:12px 0 10px;text-wrap:balance}
.dmeta{color:var(--muted);font-size:13px;display:flex;gap:14px;flex-wrap:wrap}
.dmeta .when{font-family:"IBM Plex Mono",Consolas,monospace;font-size:12px}
.dbody{padding:20px 2px;border-bottom:1px solid var(--line-soft)}
.rich{white-space:pre-wrap;line-height:1.8;overflow-wrap:anywhere}
.rich a{word-break:break-all}
.qimg{display:block;max-width:100%;max-height:420px;border:1px solid var(--line);border-radius:4px;margin:8px 0}
.dactions{display:flex;gap:6px;justify-content:flex-end;padding:8px 0;flex-wrap:wrap}
.linkbtn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:4px 8px;border-radius:3px;text-decoration:none;display:inline-block}
.linkbtn:hover{color:var(--accent-ink);background:var(--surface2)}
.linkbtn.danger:hover{color:var(--danger);background:var(--danger-bg)}
.sect-title{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin:26px 0 4px}
.reply{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:15px 18px;margin:12px 0}
.reply.official{border-left:3px solid var(--accent)}
.reply-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.reply-head .who{font-weight:500;font-size:14px}
.reply-head .when{font-family:"IBM Plex Mono",Consolas,monospace;font-size:11.5px;color:var(--muted)}
.reply-head .edited{font-size:11.5px;color:var(--muted)}
.badge-official{display:inline-block;font-size:11.5px;padding:1px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.reply-actions{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.noreply{color:var(--muted);font-size:14px;padding:18px 2px}

.panel{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:20px 22px;margin:16px 0}
.panel h2{font-family:"Noto Serif TC",serif;font-size:19px;font-weight:700;margin-bottom:4px}
.panel .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:6px}
.field input[type="text"],.field input[type="email"],.field input[type="password"],.field textarea,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font-size:15px}
.field textarea{min-height:170px;resize:vertical;line-height:1.7}
.field input:focus,.field textarea:focus,.field select:focus,.search-input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.field .hint{font-size:12px;color:var(--muted);margin-top:5px}
.check{display:flex;align-items:flex-start;gap:9px;font-size:14px;cursor:pointer}
.check input{width:16px;height:16px;margin-top:3px;accent-color:var(--accent)}
.check .why{display:block;font-size:12px;color:var(--muted)}
.form-foot{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.form-foot .note{font-size:12.5px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.compose-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start;margin-top:16px}
.similar-panel{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:16px 18px;position:sticky;top:16px}
.similar-panel h3{font-size:13.5px;font-weight:700;margin-bottom:4px}
.similar-panel .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
.sim-item{display:block;padding:9px 10px;border-radius:4px;text-decoration:none;color:inherit;border:1px solid transparent}
.sim-item:hover{background:var(--surface2)}
.sim-item .t{font-size:13.5px;line-height:1.45}
.sim-item .m{font-size:11.5px;color:var(--muted);font-family:"IBM Plex Mono",Consolas,monospace;margin-top:2px}
.sim-empty{font-size:12.5px;color:var(--muted);padding:6px 2px}
.attach-row{display:flex;gap:8px;align-items:center;margin-top:6px}

.foot{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.foot .tools{display:flex;gap:6px;flex-wrap:wrap}

/* login / auth */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:32px 30px}
.auth-card .wordmark{font-size:24px;text-align:center}
.auth-card .tagline{text-align:center;margin-bottom:24px}
.auth-err{background:var(--danger-bg);color:var(--danger);border-radius:4px;padding:9px 13px;font-size:13.5px;margin-bottom:14px;display:none}
.auth-err.show{display:block}

/* users table */
.utable{width:100%;border-collapse:collapse;font-size:13.5px}
.utable th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
.utable td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.utable .em{font-family:"IBM Plex Mono",Consolas,monospace;font-size:12.5px}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.tag.on{background:var(--accent-soft);color:var(--accent-ink)}
.tag.warn{background:var(--open-bg);color:var(--open)}

.boot{padding:80px 20px;text-align:center;color:var(--muted)}
.spin{width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:kbspin .8s linear infinite;display:inline-block;vertical-align:-3px;margin-right:10px}
@keyframes kbspin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(8px);bottom:28px;background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:5px;font-size:14px;box-shadow:var(--shadow);z-index:80;opacity:0;transition:opacity .18s,transform .18s;max-width:86vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,25,.45);display:flex;align-items:center;justify-content:center;z-index:75;padding:20px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:22px 24px;max-width:420px;width:100%}
.modal h3{font-size:16px;font-weight:700;margin-bottom:8px}
.modal p{color:var(--muted);font-size:14px;margin-bottom:18px;line-height:1.7}
.modal .acts{display:flex;justify-content:flex-end;gap:10px}

/* AI chat */
.ai-fab{position:fixed;right:22px;bottom:22px;z-index:60;display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;border:none;background:var(--accent);color:var(--on-accent);font-size:14.5px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
.ai-fab:hover{filter:brightness(1.07)}
.ai-panel{position:fixed;right:22px;bottom:22px;z-index:65;width:min(380px,calc(100vw - 24px));height:min(560px,calc(100vh - 48px));background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.ai-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ai-head .t{font-weight:700;font-size:15px}
.ai-head .s{font-size:11.5px;color:var(--muted)}
.ai-close{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:2px 8px;border-radius:4px}
.ai-close:hover{background:var(--surface2)}
.ai-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.ai-msg{max-width:86%;padding:9px 13px;border-radius:10px;font-size:14px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.ai-msg.user{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:3px}
.ai-msg.bot{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:3px}
.ai-msg.bot a{color:var(--accent-ink);font-weight:500}
.ai-refs{align-self:flex-start;display:flex;flex-wrap:wrap;gap:6px;max-width:86%}
.ai-refs a{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);text-decoration:none}
.ai-typing{align-self:flex-start;color:var(--muted);font-size:13px;padding:4px 13px}
.ai-form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.ai-input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-size:14px}
.ai-input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.ai-send{padding:10px 16px;border-radius:6px;border:none;background:var(--accent);color:var(--on-accent);font-weight:500;cursor:pointer}
.ai-send[disabled]{opacity:.5;cursor:not-allowed}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:720px){
  .ai-panel{right:12px;bottom:12px}
  .ai-fab{right:16px;bottom:16px}
  .masthead{flex-direction:column;align-items:flex-start;gap:8px;padding-top:22px}
  .mast-right{align-items:flex-start}
  .mast-stats{text-align:left}
  .userbar{justify-content:flex-start}
  .qrow{grid-template-columns:4px minmax(0,1fr) auto;gap:0 12px}
  .qnum{display:none}
  .qsnippet{display:none}
  .compose-grid{grid-template-columns:1fr}
  .similar-panel{position:static}
  .row2{grid-template-columns:1fr}
  .utable th:nth-child(4),.utable td:nth-child(4){display:none}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none !important;animation:none !important}
}
</style>
</head>

<div id="root"><div class="boot"><span class="spin"></span>載入中…</div></div>
<script>
(function(){
'use strict';

/* ================= helpers ================= */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
function pad(n){return (n<10?'0':'')+n;}
function fmtDate(iso){var d=new Date(iso);if(isNaN(d.getTime()))return '';return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function debounce(fn,ms){var t;return function(){var a=arguments,s=this;clearTimeout(t);t=setTimeout(function(){fn.apply(s,a);},ms);};}
function val(id){var el=document.getElementById(id);return el?el.value:'';}

async function api(path,opts){
  opts=opts||{};
  if(opts.body&&typeof opts.body!=='string'&&!(opts.body instanceof Blob)){opts.body=JSON.stringify(opts.body);}
  opts.headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});
  var res=await fetch(path,opts);
  var body=null;
  try{body=await res.json();}catch(e){}
  if(!res.ok){
    var e2=new Error((body&&body.error)||('連線失敗（'+res.status+'）'));
    e2.status=res.status;e2.code=body&&body.error;
    throw e2;
  }
  return body;
}

function hlEsc(text,parts){
  text=String(text==null?'':text);
  var ranges=[];
  if(parts&&parts.length){
    var low=text.toLowerCase();
    parts.forEach(function(p){
      if(!p||p.length<2)return;
      var i=0;
      while((i=low.indexOf(p,i))!==-1){ranges.push([i,i+p.length]);i+=1;}
    });
    ranges.sort(function(a,b){return a[0]-b[0];});
    var merged=[];
    ranges.forEach(function(r){
      if(merged.length&&r[0]<=merged[merged.length-1][1]){merged[merged.length-1][1]=Math.max(merged[merged.length-1][1],r[1]);}
      else merged.push([r[0],r[1]]);
    });
    ranges=merged;
  }
  var out='',pos=0;
  ranges.forEach(function(r){
    out+=esc(text.slice(pos,r[0]))+'<mark>'+esc(text.slice(r[0],r[1]))+'</mark>';
    pos=r[1];
  });
  return out+esc(text.slice(pos));
}
function isImageUrl(url){
  if(/\.(png|jpe?g|gif|webp)(\?[^\s]*)?$/i.test(url))return true;
  if(/\/img\/[0-9a-f-]{36}$/.test(url))return true;
  if(url.indexOf('github.com/user-attachments/assets/')!==-1)return true;
  if(url.indexOf('user-images.githubusercontent.com/')!==-1)return true;
  return false;
}
var TOKEN_RE=/!\[[^\]\n]*\]\((https?:[^\s)]+|\/img\/[0-9a-f-]{36})\)|https?:\/\/[^\s<>"'）」』】]+/g;
function renderText(raw,parts){
  var text=String(raw==null?'':raw);
  var out='',last=0,m;
  TOKEN_RE.lastIndex=0;
  while((m=TOKEN_RE.exec(text))){
    var full=m[0];
    var url=m[1]||full;
    if(!m[1]){url=url.replace(/[.,;:!?)]+$/,'');}
    out+=hlEsc(text.slice(last,m.index),parts);
    if(isImageUrl(url)){
      out+='<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer"><img class="qimg" loading="lazy" alt="附圖" src="'+esc(url)+'"></a>';
    }else{
      out+='<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(url)+'</a>';
    }
    last=m.index+(m[1]?full.length:url.length);
    TOKEN_RE.lastIndex=last;
  }
  return out+hlEsc(text.slice(last),parts);
}

/* ================= search ================= */
var CJK_RE=/[㐀-䶿一-鿿豈-﫿]+|[a-z0-9][a-z0-9_.+#-]*/g;
function tokenize(s){
  var t=[],m,str=String(s||'').toLowerCase();
  CJK_RE.lastIndex=0;
  while((m=CJK_RE.exec(str))){
    var w=m[0];
    if(/[a-z0-9]/.test(w.charAt(0))){t.push(w);}
    else if(w.length===1){t.push(w);}
    else{for(var i=0;i<w.length-1;i++)t.push(w.slice(i,i+2));}
  }
  return t;
}
function queryParts(qstr){
  var parts=[],m,str=String(qstr||'').toLowerCase();
  CJK_RE.lastIndex=0;
  while((m=CJK_RE.exec(str))){if(m[0].length>=2)parts.push(m[0]);}
  return parts;
}
var index=null;
function buildIndex(){
  var docs=state.questions.map(function(q){
    var toks=[];
    var tt=tokenize(q.title);for(var i=0;i<3;i++)toks=toks.concat(tt);
    toks=toks.concat(tokenize(q.category),tokenize(q.project),tokenize(q.body));
    q.replies.forEach(function(r){toks=toks.concat(tokenize(r.body));});
    var tf={};toks.forEach(function(w){tf[w]=(tf[w]||0)+1;});
    return {q:q,tf:tf,len:toks.length};
  });
  var df={},N=docs.length,avg=0;
  docs.forEach(function(d){avg+=d.len;Object.keys(d.tf).forEach(function(w){df[w]=(df[w]||0)+1;});});
  avg=N?avg/N:1;
  index={docs:docs,df:df,N:N,avg:avg||1};
}
function searchQuestions(qstr){
  if(!state)return null;
  if(!index)buildIndex();
  var raw=String(qstr||'').trim();
  if(!raw)return null;
  var numM=raw.match(/^#?[qQ]?-?0*(\d{1,7})$/);
  var toks=tokenize(raw);
  var k1=1.2,b=0.75;
  var results=[];
  index.docs.forEach(function(d){
    var score=0;
    toks.forEach(function(w){
      var tf=d.tf[w];if(!tf)return;
      var df=index.df[w]||1;
      var idf=Math.log(1+(index.N-df+0.5)/(df+0.5));
      score+=idf*(tf*(k1+1))/(tf+k1*(1-b+b*d.len/index.avg));
    });
    var low=raw.toLowerCase();
    if(low.length>=2){
      if(String(d.q.title).toLowerCase().indexOf(low)!==-1)score+=6;
      else if(String(d.q.body).toLowerCase().indexOf(low)!==-1)score+=2.5;
    }
    if(numM&&d.q.num===parseInt(numM[1],10))score+=100;
    if(score>0)results.push({q:d.q,score:score});
  });
  results.sort(function(a,b2){return b2.score-a.score;});
  return results;
}

}
function confirmModal(title,body,okLabel,danger){

      '<button class="btn btn-ghost" data-r="0">取消</button>'+

function pillHtml(status){

function qnumStr(n){return 'Q-'+(n<10?'00':(n<100?'0':''))+n;}
function snippetFor(q,parts){
  var raw=String(q.body).replace(/!\[[^\]\n]*\]\([^)]*\)/g,'[附圖]').replace(/\s+/g,' ');
  if(parts&&parts.length){
    var low=raw.toLowerCase(),best=-1;
    parts.forEach(function(p){if(!p||p.length<2)return;var i=low.indexOf(p);if(i!==-1&&(best===-1||i<best))best=i;});
    if(best>40)return '…'+raw.slice(best-40,best+80);
  }
  return raw.slice(0,120);
}

/* ---------- images ---------- */
function compressImage(file){
  return new Promise(function(resolve){
    if(file.type==='image/gif'){resolve(file);return;}
    var u=URL.createObjectURL(file);
    var img=new Image();
    img.onload=function(){
      var w=img.width,h=img.height,max=1600;
      if(w>max||h>max){var k=Math.min(max/w,max/h);w=Math.round(w*k);h=Math.round(h*k);}
      var c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(function(b){URL.revokeObjectURL(u);resolve(b&&b.size<file.size?b:file);},'image/jpeg',0.85);
    };
    img.onerror=function(){URL.revokeObjectURL(u);resolve(file);};
    img.src=u;
  });
}
function insertAtCursor(ta,text){
  var s=ta.selectionStart||ta.value.length,e=ta.selectionEnd||s;
  ta.value=ta.value.slice(0,s)+text+ta.value.slice(e);
  ta.selectionStart=ta.selectionEnd=s+text.length;
  ta.dispatchEvent(new Event('input',{bubbles:true}));
}
async function uploadImageTo(ta,file){
  if(!file||!/^image\//.test(file.type)){toast('僅支援圖片檔');return;}
  toast('圖片上傳中…');
  try{
    var blob=await compressImage(file);
    if(blob.size>2*1024*1024){toast('圖片壓縮後仍超過 2MB，請縮小後再試');return;}
    var res=await fetch('/api/images',{method:'POST',headers:{'Content-Type':blob.type||'image/jpeg'},body:blob});
    var j=null;try{j=await res.json();}catch(e){}
    if(!res.ok){toast((j&&j.error)||'上傳失敗');return;}
    insertAtCursor(ta,'\n![附圖]('+location.origin+j.url+')\n');
    toast('圖片已插入');
  }catch(e){toast('上傳失敗，請稍後再試');}
}
function wireImagePaste(ta){
  if(!ta)return;
  ta.addEventListener('paste',function(ev){
    var items=(ev.clipboardData&&ev.clipboardData.files)||[];
    if(items.length&&/^image\//.test(items[0].type)){
      ev.preventDefault();
      uploadImageTo(ta,items[0]);
    }
  });
}
var fileInput=null;
function pickImage(targetId){
  if(!fileInput){
    fileInput=document.createElement('input');
    fileInput.type='file';
    fileInput.accept='image/*';
    fileInput.style.display='none';
    document.body.appendChild(fileInput);
  }
  fileInput.onchange=function(){
    var ta=document.getElementById(targetId);
    if(fileInput.files.length&&ta)uploadImageTo(ta,fileInput.files[0]);
    fileInput.value='';
  };
  fileInput.click();
}

/* ---------- exports / misc ---------- */
function download(filename,text,type){
  var blob=new Blob([text],{type:type||'text/plain;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},800);
}
function stamp(){var d=new Date();return ''+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());}
function exportJson(){
  download('kb-backup-'+stamp()+'.json',JSON.stringify({projects:state.projects,categories:state.categories,questions:state.questions},null,2),'application/json');
  toast('備份已下載');
}
function exportMd(){
  var lines=['# 外包知識庫備份','','匯出時間：'+fmtDate(new Date().toISOString())+' · 共 '+state.questions.length+' 題',''];
  state.projects.forEach(function(p){
    var qs=state.questions.filter(function(q){return q.project===p;}).sort(function(a,b){return a.num-b.num;});
    if(!qs.length)return;
    lines.push('','# 專案：'+p,'');
    qs.forEach(function(q){
      lines.push('---','','## '+qnumStr(q.num)+'　'+q.title,'');
      lines.push('- 狀態：'+(q.status==='answered'?'已回覆':'待回覆')+'　分類：'+(q.category||'未分類'));
      lines.push('- 提問：'+q.author+'（'+fmtDate(q.createdAt)+'）','');
      lines.push(q.body,'');
      q.replies.forEach(function(r){
        lines.push('### 回覆 — '+r.author+'（'+fmtDate(r.createdAt)+'）'+(r.official?'【正式解答】':''),'');
        lines.push(r.body,'');
      });
    });
  });
  download('kb-export-'+stamp()+'.md',lines.join('\n'),'text/markdown;charset=utf-8');
  toast('Markdown 已下載');
}
function copyLink(num){
  var url=location.href.split('#')[0]+'#q-'+num;
  var fail=function(){toast('無法自動複製，請直接複製網址列');};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){toast('已複製連結');},fail);
    }else fail();
  }catch(e){fail();}
}

function aiQLinkify(escaped){
  return escaped.replace(/Q-0*(\d{1,7})/g,function(m,n){return '<a href="#q-'+n+'">'+m+'</a>';});
}
function aiRenderMsgs(){
  var box=document.getElementById('aiMsgs');if(!box)return;
  var html='';
  AI.msgs.forEach(function(m){
    if(m.role==='user'){html+='<div class="ai-msg user">'+esc(m.content)+'</div>';}
    else{
      html+='<div class="ai-msg bot">'+aiQLinkify(esc(m.content))+'</div>';
      if(m.refs&&m.refs.length){
        html+='<div class="ai-refs">'+m.refs.map(function(r){
          return '<a href="#q-'+r.num+'">'+qnumStr(r.num)+' '+esc(String(r.title).slice(0,18))+'</a>';
        }).join('')+'</div>';
      }
    }
  });
  if(AI.busy)html+='<div class="ai-typing">AI 思考中…</div>';
  box.innerHTML=html;
  box.scrollTop=box.scrollHeight;
}
function aiToggle(show){
  if(!AI.panel)return;
  AI.panel.style.display=show?'flex':'none';
  AI.fab.style.display=show?'none':'flex';
  if(show){var inp=document.getElementById('aiInput');if(inp)inp.focus();aiRenderMsgs();}
}
function localAnswer(qstr){
  if(!state)return {content:'資料還在載入中，請稍候再試。',refs:[]};
  var res=(searchQuestions(qstr)||[]).slice(0,3);
  var refs=res.map(function(r){return {num:r.q.num,title:r.q.title};});
  if(!res.length||res[0].score<1.2){
    return {content:'知識庫目前沒有這一題的相關資料。建議點「提出問題」發問，管理者會盡快回覆。',refs:refs};
  }
  var top=res[0].q;
  var official=(top.replies||[]).filter(function(r){return r.official;});
  var content;
  if(official.length){
    var ans=official.map(function(r){return r.body;}).join('\n');
    content='這題和 '+qnumStr(top.num)+'「'+top.title+'」最相關，正式解答如下：\n\n'+ans.slice(0,500)+(ans.length>500?'…（完整內容請點 '+qnumStr(top.num)+'）':'');
  }else{
    content='已經有人問過類似的問題：'+qnumStr(top.num)+'「'+top.title+'」，目前還在等待管理者回覆，可以點進去追蹤。';
  }
  return {content:content,refs:refs};
}
function aiFinish(){
  AI.busy=false;
  var b=document.getElementById('aiSend');if(b)b.disabled=false;
  aiRenderMsgs();
  var i2=document.getElementById('aiInput');if(i2)i2.focus();
}
function aiSend(){
  var inp=document.getElementById('aiInput');
  var q=inp?inp.value.trim():'';
  if(!q||AI.busy)return;
  AI.msgs.push({role:'user',content:q});
  inp.value='';
  AI.busy=true;
  var btn=document.getElementById('aiSend');if(btn)btn.disabled=true;
  aiRenderMsgs();
  api('/api/ask',{method:'POST',body:{question:q,history:AI.msgs.slice(-9,-1).map(function(m){return {role:m.role,content:m.content};})}})
    .then(function(res){
      AI.msgs.push({role:'assistant',content:String(res.answer||'').trim()||'（沒有收到回覆）',refs:res.refs||[]});
    })
    .catch(function(e){
      if(e.status===401){renderLogin('登入已過期，請重新登入');return;}
      var a=localAnswer(q);
      AI.msgs.push({role:'assistant',content:'AI 服務暫時無法使用，先用知識庫檢索回答你：\n\n'+a.content,refs:a.refs});
    })
    .then(function(){aiFinish();});
}
function aiInit(){
  if(AI.fab)return;
  AI.fab=document.createElement('button');
  AI.fab.className='ai-fab';
  AI.fab.setAttribute('aria-label','開啟 AI 小幫手');
  AI.fab.textContent='✦ 問 AI';
  AI.fab.addEventListener('click',function(){aiToggle(true);});
  document.body.appendChild(AI.fab);
  AI.panel=document.createElement('div');
  AI.panel.className='ai-panel';
  AI.panel.style.display='none';
  AI.panel.innerHTML='<div class="ai-head"><div><div class="t">AI 小幫手</div>'+
    '<div class="s">依知識庫內容回答 · 對話不會被儲存</div></div>'+
    '<button class="ai-close" aria-label="關閉">✕</button></div>'+
    '<div class="ai-msgs" id="aiMsgs"></div>'+
    '<form class="ai-form" id="aiForm"><input class="ai-input" id="aiInput" type="text" maxlength="500" placeholder="直接輸入你的問題，例如：檔案要怎麼命名？" autocomplete="off">'+
    '<button type="submit" class="ai-send" id="aiSend">送出</button></form>';
  document.body.appendChild(AI.panel);
  AI.panel.querySelector('.ai-close').addEventListener('click',function(){aiToggle(false);});
  AI.panel.querySelector('#aiForm').addEventListener('submit',function(ev){ev.preventDefault();aiSend();});
  AI.msgs.push({role:'assistant',content:'你好！直接輸入你的問題，我會根據知識庫內容回答並附上相關題號。找不到答案的話，建議直接發問。',refs:[]});
}

/* ================= render + events ================= */
function pageTitle(){
  var r=route();
  if(r.view==='detail'){
    var q=findByNum(r.num);
    return q?qnumStr(q.num)+' '+q.title.slice(0,24)+'｜外包知識庫':'外包知識庫';
  }
  if(r.view==='project')return r.pname+'｜外包知識庫';
  if(r.view==='compose')return '提出問題｜外包知識庫';
  if(r.view==='admin')return '管理｜外包知識庫';
  return '外包知識庫';
}
function render(){
  if(!state){renderLogin();return;}
  editingReplyId=null;
  var r=route();
  if(r.view==='detail')mountDetail(r.num);
  else if(r.view==='project')mountProject(r.pname);
  else if(r.view==='compose')mountCompose();
  else if(r.view==='admin')mountAdmin();
  else mountHome();
  document.title=pageTitle();
  window.scrollTo(0,0);
}
async function refresh(quiet){
  try{
    await loadData();
    render();
    if(!quiet)toast('資料已更新');
  }catch(e){handleApiError(e,'更新失敗');}
}
window.addEventListener('hashchange',function(){
  if(!state)return;
  if(route().view!=='compose')editingQId=null;
  render();
});
document.addEventListener('keydown',function(ev){
  var tag=(ev.target&&ev.target.tagName)||'';
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
  if(ev.key==='/'){var si=document.getElementById('searchInput');if(si){ev.preventDefault();si.focus();}}
});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible'||!state)return;
  var ae=document.activeElement;
  if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'))return;
  if(Date.now()-loadedAt>5*60*1000)refresh(true);
});
root.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');
  if(!el)return;
  var act=el.getAttribute('data-act');
  if(act==='go-home'){ev.preventDefault();if(location.hash&&location.hash!=='#')location.hash='';else render();return;}
  if(act==='go-project'){ev.preventDefault();location.hash='#p-'+encodeURIComponent(el.getAttribute('data-p'));return;}
  if(act==='go-back-ctx'){ev.preventDefault();editingQId=null;if(ui.proj&&state.projects.indexOf(ui.proj)!==-1)location.hash='#p-'+encodeURIComponent(ui.proj);else location.hash='';return;}
  if(act==='go-new'){ev.preventDefault();editingQId=null;location.hash='#new';return;}
  if(act==='go-new-with-q'){ev.preventDefault();editingQId=null;location.hash='#new';return;}
  if(act==='go-admin'){ev.preventDefault();location.hash='#admin';return;}
  if(act==='go-pw'){ev.preventDefault();renderChangePw(false);return;}
  if(act==='logout'){
    api('/api/logout',{method:'POST'}).then(function(){renderLogin('已登出');}).catch(function(){renderLogin();});
    return;
  }
  if(act==='chip-status'){ui.status=el.getAttribute('data-v');updateChips();updateResults();return;}
  if(act==='chip-cat'){var v=el.getAttribute('data-v');ui.cat=(ui.cat===v)?null:v;updateChips();updateResults();return;}
  if(act==='refresh'){refresh(false);return;}
  if(act==='copy-link'){copyLink(parseInt(el.getAttribute('data-n'),10));return;}
  if(act==='attach'){pickImage(el.getAttribute('data-target'));return;}
  if(act==='edit-q'){editingQId=parseInt(el.getAttribute('data-n'),10);location.hash='#new';return;}
  if(act==='cancel-edit-q'){editingQId=null;location.hash='#q-'+el.getAttribute('data-n');return;}
  if(act==='del-q'){
    (async function(){
      var num=parseInt(el.getAttribute('data-n'),10);
      var q=findByNum(num);if(!q)return;
      var ok=await confirmModal('刪除 '+qnumStr(num)+'？','「'+q.title.slice(0,40)+'」及其所有回覆將被永久刪除。','刪除',true);
      if(!ok)return;
      try{
        await api('/api/questions/'+num,{method:'DELETE'});
        await loadData();
        location.hash='#p-'+encodeURIComponent(q.project);
        toast('已刪除');
      }catch(e){handleApiError(e);}
    })();
    return;
  }
  if(act==='edit-reply'){editingReplyId=parseInt(el.getAttribute('data-r'),10);mountDetail(route().num);var eb=document.getElementById('editReplyBody');if(eb)wireImagePaste(eb);return;}
  if(act==='cancel-reply-edit'){editingReplyId=null;mountDetail(route().num);return;}
  if(act==='save-reply-edit'){saveReplyEdit(parseInt(el.getAttribute('data-r'),10));return;}
  if(act==='del-reply'){
    (async function(){
      var rid=parseInt(el.getAttribute('data-r'),10);
      var ok=await confirmModal('刪除這則回覆？','刪除後無法復原，問題狀態會重新計算。','刪除',true);
      if(!ok)return;
      try{
        await api('/api/replies/'+rid,{method:'DELETE'});
        await loadData();
        render();
        toast('已刪除');
      }catch(e){handleApiError(e);}
    })();
    return;
  }
  if(act==='toggle-official'){
    (async function(){
      try{
        await api('/api/replies/'+el.getAttribute('data-r')+'/official',{method:'POST',body:{official:el.getAttribute('data-v')==='1'}});
        await loadData();
        render();
      }catch(e){handleApiError(e);}
    })();
    return;
  }
  if(act==='reset-user'){
    (async function(){
      var email=el.getAttribute('data-e');
      var ok=await confirmModal('重設密碼？',email+' 的密碼會重設為預設密碼 qwerty，對方下次登入時需重新設定。','重設');
      if(!ok)return;
      try{await api('/api/users/'+encodeURIComponent(email)+'/reset',{method:'POST',body:{}});toast('已重設為預設密碼');loadUsers();}catch(e){handleApiError(e);}
    })();
    return;
  }
  if(act==='del-user'){
    (async function(){
      var email=el.getAttribute('data-e');
      var ok=await confirmModal('移除成員？',email+' 將無法再登入知識庫（既有的問答內容會保留）。','移除',true);
      if(!ok)return;
      try{await api('/api/users/'+encodeURIComponent(email),{method:'DELETE'});toast('已移除');loadUsers();}catch(e){handleApiError(e);}
    })();
    return;
  }
  if(act==='del-proj'){
    (async function(){
      var name=el.getAttribute('data-p');
      var ok=await confirmModal('刪除專案「'+name+'」？','只有沒有任何問題的專案可以刪除。','刪除',true);
      if(!ok)return;
      try{await api('/api/projects/'+encodeURIComponent(name),{method:'DELETE'});await loadData();renderProjBox();toast('已刪除');}catch(e){handleApiError(e);}
    })();
    return;
  }
  if(act==='export-json'){exportJson();return;}
  if(act==='export-md'){exportMd();return;}
});

enterApp();
})();
</script>
